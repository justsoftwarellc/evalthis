[package]
name = "evalme"
version = "0.1.0"
edition = "2021"
description = "Scaffold an opinionated, model-agnostic eval framework into a Node.js project"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
